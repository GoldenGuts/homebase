# Xcode project for the iOS app and its widgets. Generate it with XcodeGen:
#   ./build-core.sh          # builds ../shared into HomebaseCore.xcframework (Kotlin Multiplatform)
#   xcodegen generate        # writes Homebase.xcodeproj
name: Homebase
options:
  bundleIdPrefix: in.weenja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited)"
    # HomebaseCore is built for arm64 simulators only (Apple silicon Macs).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # Swift conditions per configuration (a value in `base` would replace Debug's DEBUG flag). The iOS 27 SDK
  # adds the full-page systemExtraLargePortrait family: add HOMEBASE_IOS27 to both when building with Xcode 27.
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
targets:
  Homebase:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: HomebaseWidgets
        embed: true
      - framework: ../shared/build/XCFrameworks/release/HomebaseCore.xcframework
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Homebase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # homebase://pro: a locked widget opens the Homebase Pro screen
        CFBundleURLTypes:
          - CFBundleURLName: in.weenja.homebase
            CFBundleURLSchemes: [homebase]
        NSLocalNetworkUsageDescription: Homebase looks for Home Assistant on your local network so you can connect without typing its address.
        NSBonjourServices: [_home-assistant._tcp]
        # Home Assistant is often plain http on the home network (http://homeassistant.lan:8123), at an
        # address the user types. Any finer ATS key would make iOS ignore this one, so it stands alone.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/Homebase.entitlements
      properties:
        com.apple.security.application-groups: [group.in.weenja.homebase]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.weenja.homebase
        PRODUCT_NAME: Homebase
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  HomebaseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/HomebaseCore.xcframework
        embed: false
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Homebase
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Widgets/HomebaseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.in.weenja.homebase]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.weenja.homebase.widgets
        PRODUCT_NAME: HomebaseWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
schemes:
  Homebase:
    build:
      targets:
        Homebase: all
        HomebaseWidgets: all
    run:
      config: Debug
    archive:
      config: Release
